[workspace]
members = [
    "bismark-lib",
    "bismark-filter-non-conversion",
    "bismark-methylation-consistency",
    "bismark-bam2nuc",
    "bismark-nome-filtering",
    "bismark-dedup",
    "bismark-bedgraph",
    "bismark-genome-prep",
    "bismark-coverage2cytosine",
    "bismark-extractor",
    "bismark-report",
    "bismark-summary",
]
resolver = "2"

[workspace.dependencies]
bismark-lib   = { path = "bismark-lib" }
clap          = { version = "4.5", features = ["derive", "wrap_help"] }
anyhow        = "1.0"
thiserror     = "2.0"
flate2        = "1.0"
indexmap      = "2.2"
rustc-hash    = "2.0"
rayon         = "1.10"
memmap2       = "0.9"
regex         = "1.10"
walkdir       = "2.5"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
